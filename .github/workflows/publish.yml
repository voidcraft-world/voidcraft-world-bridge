# Publishes to PyPI on a version tag (`v0.1.0`), through PyPI trusted publishing:
# PyPI accepts the upload only from THIS repo, THIS workflow file and the `pypi`
# environment, proven by a short-lived OIDC token GitHub signs. No API token is
# stored anywhere. Renaming this file or the environment breaks publishing until
# the publisher on PyPI is updated to match.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: uv run pytest -q
      - run: uv build
      - name: The wheel installs and runs
        # Same smoke as ci.yml's build job: owned there, see the note.
        run: |
          uvx --from dist/*.whl voidcraft-world-bridge --version
          set +e
          uvx --from dist/*.whl voidcraft-world-bridge status --port 7799
          test $? -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can mint the PyPI token, and it runs no project code.
    environment: pypi
    permissions:
      id-token: write
      contents: write   # the GitHub Release below
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      - name: GitHub Release with the wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
