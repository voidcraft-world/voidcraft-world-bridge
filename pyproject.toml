[project]
name = "voidcraft-world-bridge"
version = "0.1.1"
description = "A loopback server that lets voidcraft.world reach your machine — starting with your own local LLM"
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VoidCraft" }]
keywords = ["local-llm", "ollama", "lm-studio", "llama.cpp", "voidcraft", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Stdlib only, on purpose — see voidcraft_world_bridge/server.py.
dependencies = []

[project.urls]
Homepage = "https://voidcraft.world"
Source = "https://github.com/voidcraft-world/voidcraft-world-bridge"
Issues = "https://github.com/voidcraft-world/voidcraft-world-bridge/issues"

[project.scripts]
voidcraft-world-bridge = "voidcraft_world_bridge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=7.4.0,<8",
    "ruff>=0.16,<0.17",
]

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["voidcraft_world_bridge", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true
# Not disallow_untyped_defs / disallow_any_generics: every JSON edge is a bare `dict` on
# purpose (bodies arrive from a browser), and `dict[str, Any]` everywhere adds nothing.

[tool.ruff]
line-length = 120
# target-version is read from requires-python.

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "ARG", "SIM", "N", "RUF"]
ignore = [
    # RuntimeDown, RuntimeRefused, JobFailure, QueueFull, AgentRefused: names a host already catches.
    "N818",
    # En dashes in ranges (`1–4`, `5–60 s`) are typography, not confusables.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# A fake implements a contract's signature and ignores most of it.
"tests/*" = ["ARG"]

[tool.uv.build-backend]
# voidcraft_world_bridge/ lives at the project root (flat layout), not under src/
module-root = ""

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
